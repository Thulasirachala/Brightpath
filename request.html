<main class="section form-page"><div class="form-card"><p class="eyebrow">START A PROJECT</p><h1>Request a Solution</h1><p>Tell us what you need. This prototype stores the form locally for demonstration.</p>
<form id="requestForm"><label>Name<input required name="name" placeholder="Your name"></label><label>Mobile Number<input required name="mobile" placeholder="10-digit mobile number"></label><label>Email<input type="email" required name="email" placeholder="you@example.com"></label><label>Business Type<select name="business"><option>Individual</option><option>Startup</option><option>Small Business</option><option>Other</option></select></label><label>Service Needed<select name="service"><option>Idea Development</option><option>Digital Solution</option><option>Creative Solution</option><option>Business Support</option><option>Startup Support</option></select></label><label>Budget<select name="budget"><option>Under ₹5,000</option><option>₹5,000–₹20,000</option><option>₹20,000–₹50,000</option><option>Above ₹50,000</option></select></label><label>What do you need?<textarea required name="details" rows="5" placeholder="Describe your idea or problem..."></textarea></label><button class="btn" type="submit">Submit Request</button><p id="formMessage" class="message"></p></form></div></main><footer>© 2026 BrightPath Solutions</footer><script src="js/script.js"></script></body></html>
